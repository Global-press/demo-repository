name: Auto-Publish News

on:
  schedule:
    - cron: '0 * * * *' # Every hour

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set Git Identity
        run: |
          git config user.name "GlobalPressBot"
          git config user.email "bot@globalpress.media"

      - name: Fetch News
        run: curl "https://newsapi.org/v2/top-headlines?country=us&apiKey=${{ secrets.NEWS_API_KEY }}" > news.json

      - name: Format HTML
        run: node format-news.js

      - name: Commit & Push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git add .
          git commit -m "Auto-update news"
          git push https://x-access-token:${GH_TOKEN}@github.com/Global-press/demo-repository.git
